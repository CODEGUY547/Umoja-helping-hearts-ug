<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Umoja Helping Hearts Uganda</title>
<style>
:root{--navy1:#1b4290;--navy2:#071634;--pink:#f9767c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#071634;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.site{display:none!important;min-height:100%;place-items:center;text-align:center;padding:2rem;background:#f7f2ee;color:#0b1d45}
.site h1{font-size:clamp(1.8rem,5vw,3rem)}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;overflow:hidden;
 background:radial-gradient(circle at 50% 42%,#13307a,var(--navy2) 72%);
 transition:opacity .9s ease,transform .9s cubic-bezier(.7,0,.3,1),visibility .9s}
#splash.out{opacity:0;transform:scale(1.15);visibility:hidden}
.stage{width:min(86vw,62vh,560px);aspect-ratio:1;position:relative;display:grid}
.stage svg{width:100%;height:100%;overflow:visible}
.halo{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,150,160,.45),transparent 60%);opacity:0;animation:halo 3s ease-in-out 2.5s infinite}
@keyframes halo{0%,100%{opacity:.2;transform:scale(.95)}50%{opacity:.6;transform:scale(1.1)}}
/* 1. hearts gather (JS) then the heart grows */
.heart{transform-box:fill-box;transform-origin:50% 85%;
 animation:grow 2.2s cubic-bezier(.3,0,.4,1) .3s both,ignite .7s cubic-bezier(.2,1.8,.4,1) 2.5s both,beat 1.3s ease-in-out 3.4s infinite}
@keyframes grow{from{transform:scale(0);opacity:0}15%{opacity:1}to{transform:scale(.6);opacity:1}}
@keyframes ignite{from{transform:scale(.6)}to{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.07)}28%{transform:scale(1)}42%{transform:scale(1.045)}}
/* 2. shockwaves */
.wave{fill:none;stroke:#fff;stroke-width:6;transform-box:fill-box;transform-origin:center;opacity:0;animation:wave 1.1s ease-out 2.5s both}
.wave.w2{animation-delay:2.75s;stroke:#f9767c}
@keyframes wave{from{transform:scale(.5);opacity:.9}to{transform:scale(9);opacity:0;stroke-width:1}}
/* 3. disc + sunburst burst */
.disc{transform-box:fill-box;transform-origin:center;animation:disc .8s cubic-bezier(.2,.9,.3,1) 2.5s both}
@keyframes disc{from{transform:scale(0)}to{transform:none}}
.rays line{stroke-dasharray:1;animation:draw .8s ease-out calc(2.7s + var(--p)*.06s) both}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:1}}
.glow{animation:fade 1s ease-out 2.7s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 4. text, hands, ribbon */
.gl{animation:fade .5s ease-out calc(3s + var(--i)*.045s) both}
.ringtxt{transform-box:fill-box;transform-origin:center;animation:spin 1.6s cubic-bezier(.2,.8,.2,1) 3s both}
@keyframes spin{from{transform:rotate(-25deg) scale(.96)}to{transform:none}}
.hand{animation:rise 1s cubic-bezier(.2,.9,.3,1.1) 3.2s both}
.hand.r{animation-delay:3.35s}
@keyframes rise{from{transform:translateY(160px);opacity:0}to{transform:none;opacity:1}}
.tail{animation:tail .7s cubic-bezier(.2,.9,.3,1) 4s both}
.tail.l{--x:80px} .tail.r{--x:-80px}
@keyframes tail{from{transform:translateX(var(--x));opacity:0}to{transform:none;opacity:1}}
.band{transform-box:fill-box;transform-origin:center;animation:unfurl .8s cubic-bezier(.2,.9,.3,1) 4s both}
@keyframes unfurl{from{transform:scaleX(0)}to{transform:none}}
.gl2{animation:fade .4s ease-out calc(4.5s + var(--i)*.04s) both}
.bar{position:absolute;left:50%;bottom:7vh;width:min(60vw,320px);height:5px;border-radius:9px;background:rgba(255,255,255,.15);transform:translateX(-50%);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#fff);transform-origin:left;animation:load 5.4s cubic-bezier(.5,0,.3,1) .2s both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.skip{position:absolute;right:max(1rem,env(safe-area-inset-right));top:max(1rem,env(safe-area-inset-top));background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:.4rem .9rem;font:inherit;font-size:.85rem;cursor:pointer;opacity:.75;z-index:3}
.skip:hover{opacity:1}
.mini{position:fixed;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:none;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

<script>
(function(){
  var s=document.getElementById('splash'),done=false;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hide(){ if(done)return; done=true; s.classList.add('out');
    setTimeout(function(){ s.remove(); document.dispatchEvent(new CustomEvent('splash:done')); parent.postMessage('umoja:splash-done','*'); },950); }

  // small hearts rise from the bottom and merge into the big heart
  if(!reduce){
    var r=document.getElementById('logo').getBoundingClientRect();
    var cx=r.left+(442-20)/824*r.width, cy=r.top+(365-20)/824*r.height;
    var W=innerWidth,H=innerHeight,cols=['#ec2f43','#f9767c','#ff9aa2','#ffffff'];
    for(var i=0;i<38;i++){
      var sz=10+Math.random()*20, d=document.createElementNS('http://www.w3.org/2000/svg','svg');
      d.setAttribute('viewBox','0 0 24 22'); d.setAttribute('class','mini'); d.style.setProperty('--s',sz+'px');
      d.style.left=cx+'px'; d.style.top=cy+'px'; d.style.fill=cols[i%4];
      d.innerHTML='<use href="#hrt"/>'; s.appendChild(d);
      var x0=(Math.random()-.5)*W*.95, y0=(H-cy)+40+Math.random()*120,
          x1=x0*.55+(Math.random()-.5)*120, y1=y0*.3, delay=100+Math.random()*1100;
      d.animate([
        {transform:'translate('+x0+'px,'+y0+'px) scale(1)',opacity:0},
        {transform:'translate('+x1+'px,'+y1+'px) scale(1.1)',opacity:.9,offset:.55},
        {transform:'translate(0,0) scale(.25)',opacity:0}
      ],{duration:2350-delay,delay:delay,easing:'cubic-bezier(.3,.1,.3,1)',fill:'both'})
       .onfinish=(function(el){return function(){el.remove()}})(d);
    }
  }
  setTimeout(hide, reduce?1200:6600);            // total splash time (ms) - change here
  document.getElementById('skip').onclick=hide;
  addEventListener('keydown',function(e){ if(e.key==='Escape')hide(); });
})();
</script></body></html>
